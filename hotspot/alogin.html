<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="2; url=$(link-redirect)">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Starlink - Connecting</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script>
        function startClock() {
            $(if popup == 'true')
            open('$(link-status)', 'hotspot_status', 'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=290,height=200');
        $(endif)
        location.href = unescape('$(link-redirect-esc)');
        }

    </script> 
</head>

<body onLoad="startClock()">
    <div class="ie-fixMinHeight">
        <div class="main">
            <div class="wrap">
                <div class="theme-switch">
                    <button type="button" class="theme-toggle" onclick="cycleTheme()" aria-label="Switch theme">
                        <span class="tt-swatch" aria-hidden="true"></span>
                        <span class="theme-label">Ocean</span>
                    </button>
                </div>
                <div class="brand">
                    <span class="mark">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path d="M3.6 14.2h16.8l-2.1 4.3a2 2 0 0 1-1.8 1.1H7.5a2 2 0 0 1-1.8-1.1L3.6 14.2Zm8.4-11 4.4 2.3v5.7H7.6V5.5L12 3.2Zm0-2.2L5.6 3.4v8.9h12.8V3.4L12 0Zm-1 5.1h2v1.9h-2V5.1Zm0 3.2h2v1.9h-2V8.3Z"/>
                        </svg>
                    </span>
                    <span class="name">Starlink Internet</span>
                    <span class="tag">Connecting</span>
                </div>
                <h1>You're connected aboard</h1>
                <p class="info">If nothing happens, click <a href="$(link-redirect)">here</a>.</p>
                <div class="credit">
                    <p>Designed by <span class="by">Engineer</span></p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
