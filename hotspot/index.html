<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlink - Traffic Statistics</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <style>
        /* traffic page — themed table on top of shared style.css */
        .tf-page { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 26px 16px 70px; }

        .tf-head { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 16px; }
        .tf-head .mark {
            width: 42px; height: 42px; padding: 9px; border-radius: 50%;
            background: linear-gradient(145deg, var(--accent), var(--accent-2));
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.45);
        }
        .tf-head .mark svg { width: 100%; height: 100%; display: block; }
        .tf-head .mark svg * { fill: #fff; }
        .tf-title { display: flex; flex-direction: column; align-items: flex-start; line-height: 1.15; }
        .tf-title .name { font-size: 20px; font-weight: 700; color: var(--text); }
        .tf-title .tag { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--tag); }

        #status { text-align: center; font-size: 12px; color: var(--text-soft); margin: 4px 0 14px; }
        #status.loading { color: var(--accent); }
        #status.ok      { color: var(--text-soft); }
        #status.error   { color: var(--danger); }

        .table-wrap {
            overflow-x: auto;
            border-radius: 16px;
            border: 1px solid var(--card-brd);
            background: var(--card-bg);
            -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
        }
        table { width: 100%; min-width: 720px; border-collapse: collapse; color: var(--text); }
        th, td {
            padding: 11px 12px; text-align: center; white-space: nowrap;
            font-size: 13px; border-bottom: 1px solid var(--card-brd);
        }
        thead th {
            background: linear-gradient(180deg, var(--accent), var(--accent-2));
            color: var(--btn-text); position: sticky; top: 0; z-index: 2; font-weight: 700;
        }
        .category-header th { letter-spacing: .02em; }
        tbody tr:nth-child(even) td { background: var(--input-bg); }
        tbody tr:hover td { background: var(--input-bgf); }
        tfoot td { font-weight: 700; background: var(--input-bgf); color: var(--text); }
        .unlimited { color: var(--accent); font-weight: 700; }

        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { filter: brightness(1.08); }
        th.sort-asc::after  { content: " \25B2"; font-size: 10px; }
        th.sort-desc::after { content: " \25BC"; font-size: 10px; }

        .pagination { display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 16px; flex-wrap: wrap; }
        .pagination button {
            padding: 6px 12px; border: 1px solid var(--card-brd); border-radius: 8px;
            background: var(--input-bg); color: var(--text); cursor: pointer; font-size: 13px;
            transition: background .2s ease;
        }
        .pagination button:hover { background: var(--input-bgf); }
        .pagination button.active { background: var(--accent); color: var(--btn-text); border-color: transparent; }
        .pagination button:disabled { opacity: .4; cursor: default; }
        .pagination .ellipsis { padding: 0 4px; color: var(--text-soft); }

        .version { position: fixed; bottom: 10px; right: 12px; font-size: 11px; color: var(--text-soft); z-index: 1; }
    </style>

    <script>
        var usersData    = {};
        var extraData    = {};
        var allRows      = [];
        var filteredRows = [];
        var sortCol      = null;
        var sortDir      = 1;
        var currentPage  = 1;
        var PAGE_SIZE    = 50;
        var MAX_PARTS    = 15;      // до ~300 пользователей (test.txt, test_2.txt, ...)
        var busy         = false;

        var fetchFresh = function(url) {
            return fetch(url + '?ts=' + Date.now(), { cache: 'no-store' });
        };

        function partName(base, i) {
            return i === 1 ? base + '.txt' : base + '_' + i + '.txt';
        }

        // Грузит base.txt, base_2.txt, ... пока части существуют
        function loadSeries(base) {
            var chunks = [];
            function step(i) {
                if (i > MAX_PARTS) return Promise.resolve(chunks.join('\n'));
                return fetchFresh(partName(base, i))
                    .then(function(r) {
                        if (!r.ok) throw new Error('no part ' + i);
                        return r.text();
                    })
                    .then(function(t) {
                        if (t && t.trim() !== '') chunks.push(t);
                        return step(i + 1);
                    })
                    .catch(function() { return chunks.join('\n'); });
            }
            return step(1);
        }

        function tick() {
            if (busy) return;
            busy = true;
            setStatus('loading', 'Updating…');
            loadAll()
                .catch(function(err) {
                    console.error(err);
                    setStatus('error', 'Load error');
                })
                .finally(function() { busy = false; });
        }

        function loadAll() {
            return loadSeries('test')
                .then(function(usersText) {
                    var parsed = parseUsers(usersText);
                    if (Object.keys(parsed).length === 0) {
                        setStatus('error', 'No user data (files empty or truncated)');
                        return null;
                    }
                    usersData = parsed;
                    return loadSeries('test2');
                })
                .then(function(sessionsText) {
                    if (sessionsText === null || sessionsText === undefined) return;
                    extraData = parseSessions(sessionsText);
                    buildAndRender();
                });
        }

        function parseUsers(text) {
            var out = {};
            String(text).replace(/\r/g, '').split('\n').forEach(function(line) {
                line = line.trim();
                var nameM = line.match(/Name:\s*([^,]+)/);
                var inM   = line.match(/Bytes In:\s*(\d+)/);
                var outM  = line.match(/Bytes Out:\s*(\d+)/);
                var srvM  = line.match(/Server:\s*([^,]+)/);
                var limM  = line.match(/Limit Bytes Total:\s*(\d*)/);
                if (!nameM || !srvM) return;
                var username   = nameM[1].trim();
                var server     = srvM[1].trim();
                var bytesIn1   = inM  ? parseInt(inM[1], 10)  : 0;
                var bytesOut1  = outM ? parseInt(outM[1], 10) : 0;
                var limitBytes = (limM && limM[1] !== '') ? parseInt(limM[1], 10) : 0;
                var isUnlim    = /-un$/i.test(username);   // безлимит только для логинов с суффиксом -un
                if (server.indexOf('hotspot') === 0 || username === 'admin') {
                    out[username] = {
                        name: username,
                        bytesIn1: bytesIn1,
                        bytesOut1: bytesOut1,
                        limitBytes: limitBytes,
                        isUnlimited: isUnlim,
                        limitTotalGB: isUnlim ? 'UNLIMITED' : (limitBytes / 1e9).toFixed(3)
                    };
                }
            });
            return out;
        }

        function parseSessions(text) {
            var out = {};
            String(text).replace(/\r/g, '').split('\n').forEach(function(line) {
                line = line.trim();
                if (!line) return;
                var m = line.match(/user=([^;]+)/);
                if (!m) return;
                var username = m[1].trim();
                var inM  = line.match(/bytes-in=(\d+)/);
                var outM = line.match(/bytes-out=(\d+)/);
                if (!out[username]) out[username] = { loginCount: 0, bytesIn2: 0, bytesOut2: 0 };
                out[username].loginCount++;
                out[username].bytesIn2  += inM  ? parseInt(inM[1], 10)  : 0;
                out[username].bytesOut2 += outM ? parseInt(outM[1], 10) : 0;
            });
            return out;
        }

        function buildAndRender() {
            allRows = Object.values(usersData).map(function(user) {
                var ex        = extraData[user.name];
                var bytesIn2  = ex ? ex.bytesIn2  : 0;
                var bytesOut2 = ex ? ex.bytesOut2 : 0;
                var total     = user.bytesIn1 + user.bytesOut1 + bytesIn2 + bytesOut2;
                var totalGB   = (total / 1e9).toFixed(3);
                var balNum, balGB;
                if (user.isUnlimited) {
                    balNum = Infinity; balGB = 'UNLIMITED';
                } else if (user.limitBytes === 0) {
                    balNum = 0; balGB = '0.000';          // лимит не задан → баланс 0.0
                } else {
                    balNum = user.limitBytes / 1e9 - total / 1e9;
                    if (balNum < 0) balNum = 0;
                    balGB = balNum.toFixed(3);
                }
                return {
                    name:            user.name,
                    isOnline:        !!ex,
                    isUnlimited:     user.isUnlimited,
                    limitTotalGB:    user.limitTotalGB,
                    limitBytes:      user.limitBytes,
                    bytesIn1:        user.bytesIn1,
                    bytesOut1:       user.bytesOut1,
                    bytesIn2:        bytesIn2,
                    bytesOut2:       bytesOut2,
                    totalTrafficNum: total,
                    totalTrafficGB:  totalGB,
                    balanceNum:      balNum,
                    balanceGB:       balGB
                };
            });

            applySort();
            setStatus('ok', 'Last update: ' + new Date().toLocaleTimeString() +
                           ' — ' + allRows.length + ' users');
        }

        function applySort() {
            filteredRows = allRows.slice();
            if (sortCol !== null) {
                var col = sortCol, dir = sortDir;
                filteredRows.sort(function(a,b){
                    var va = a[col], vb = b[col];
                    if (typeof va === 'string' && typeof vb === 'string')
                        return va.localeCompare(vb) * dir;
                    return (va - vb) * dir;
                });
            }
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            var total  = filteredRows.length;
            var pages  = Math.max(1, Math.ceil(total / PAGE_SIZE));
            if (currentPage > pages) currentPage = pages;
            var start  = (currentPage - 1) * PAGE_SIZE;
            var slice  = filteredRows.slice(start, start + PAGE_SIZE);

            var html = '';
            for (var i = 0; i < slice.length; i++) {
                var r = slice[i];
                var dot = r.isOnline
                    ? '<span title="Online"  style="color:#27ae60;font-size:18px;line-height:1;">&#9679;</span>'
                    : '<span title="Offline" style="color:#e74c3c;font-size:18px;line-height:1;">&#9679;</span>';
                var limCell = r.isUnlimited
                    ? '<span class="unlimited">UNLIMITED</span>'
                    : r.limitTotalGB + ' GB';
                var balCell = r.isUnlimited
                    ? '<span class="unlimited">UNLIMITED</span>'
                    : r.balanceGB + ' GB';
                html += '<tr>'
                    + '<td>' + esc(r.name) + '</td>'
                    + '<td>' + dot + '</td>'
                    + '<td>' + limCell + '</td>'
                    + '<td>' + (r.bytesIn1  / 1e9).toFixed(3) + ' GB</td>'
                    + '<td>' + (r.bytesOut1 / 1e9).toFixed(3) + ' GB</td>'
                    + '<td>' + (r.bytesIn2  / 1e9).toFixed(3) + ' GB</td>'
                    + '<td>' + (r.bytesOut2 / 1e9).toFixed(3) + ' GB</td>'
                    + '<td>' + r.totalTrafficGB + ' GB</td>'
                    + '<td>' + balCell + '</td>'
                    + '</tr>';
            }
            document.getElementById('userTableBody').innerHTML = html;

            var tSum = 0, bSum = 0;
            for (var j = 0; j < filteredRows.length; j++) {
                tSum += parseFloat(filteredRows[j].totalTrafficGB) || 0;
                if (!filteredRows[j].isUnlimited && isFinite(filteredRows[j].balanceNum))
                    bSum += filteredRows[j].balanceNum;
            }
            document.getElementById('totalTrafficSum').textContent = tSum.toFixed(3) + ' GB';
            document.getElementById('balanceSum').textContent      = bSum.toFixed(3) + ' GB';

            renderPagination(pages);
        }

        function renderPagination(pages) {
            var wrap = document.getElementById('pagination');
            if (pages <= 1) { wrap.innerHTML = ''; return; }
            var html = '<button onclick="goPage(' + (currentPage-1) + ')"' + (currentPage===1?' disabled':'') + '>‹ Prev</button>';
            var delta = 2, prev = false;
            for (var p = 1; p <= pages; p++) {
                if (p===1 || p===pages || (p>=currentPage-delta && p<=currentPage+delta)) {
                    html += '<button class="' + (p===currentPage?'active':'') + '" onclick="goPage('+p+')">'+p+'</button>';
                    prev = true;
                } else if (prev) {
                    html += '<span class="ellipsis">…</span>';
                    prev = false;
                }
            }
            html += '<button onclick="goPage(' + (currentPage+1) + ')"' + (currentPage===pages?' disabled':'') + '>Next ›</button>';
            wrap.innerHTML = html;
        }

        function goPage(p) {
            var pages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
            currentPage = Math.max(1, Math.min(p, pages));
            renderPage();
        }

        var COL_KEYS = ['name','isOnline','limitBytes','bytesIn1','bytesOut1','bytesIn2','bytesOut2','totalTrafficNum','balanceNum'];

        function initSort() {
            var ths = document.querySelectorAll('th.sortable');
            ths.forEach(function(th, i) {
                th.addEventListener('click', function() {
                    var key = COL_KEYS[i];
                    sortDir = (sortCol === key) ? sortDir * -1 : 1;
                    sortCol = key;
                    ths.forEach(function(t){ t.classList.remove('sort-asc','sort-desc'); });
                    th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
                    applySort();
                });
            });
        }

        function setStatus(cls, msg) {
            var el = document.getElementById('status');
            el.className = cls;
            el.textContent = msg;
        }

        function esc(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        window.addEventListener('load', function() {
            initSort();
            tick();
        });
        setInterval(tick, 5000);
    </script>
</head>
<body>
    <div class="theme-switch">
        <button type="button" class="theme-toggle" onclick="cycleTheme()" aria-label="Switch theme">
            <span class="tt-swatch" aria-hidden="true"></span>
            <span class="theme-label">Ocean</span>
        </button>
    </div>

    <div class="tf-page">
        <div class="tf-head">
            <span class="mark">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3.6 14.2h16.8l-2.1 4.3a2 2 0 0 1-1.8 1.1H7.5a2 2 0 0 1-1.8-1.1L3.6 14.2Zm8.4-11 4.4 2.3v5.7H7.6V5.5L12 3.2Zm0-2.2L5.6 3.4v8.9h12.8V3.4L12 0Zm-1 5.1h2v1.9h-2V5.1Zm0 3.2h2v1.9h-2V8.3Z"/>
                </svg>
            </span>
            <span class="tf-title">
                <span class="tag">Traffic Statistics</span>
            </span>
        </div>

        <div id="status" class="loading">Loading…</div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr class="category-header">
                        <th rowspan="2" class="sortable">Name</th>
                        <th rowspan="2" class="sortable">Unit</th>
                        <th rowspan="2" class="sortable">Limit (GB)</th>
                        <th colspan="2">Hotspot</th>
                        <th colspan="2">Online</th>
                        <th rowspan="2" class="sortable">Total Traffic (GB)</th>
                        <th rowspan="2" class="sortable">Balance (GB)</th>
                    </tr>
                    <tr>
                        <th class="sortable">In (GB)</th>
                        <th class="sortable">Out (GB)</th>
                        <th class="sortable">In (GB)</th>
                        <th class="sortable">Out (GB)</th>
                    </tr>
                </thead>
                <tbody id="userTableBody"></tbody>
                <tfoot>
                    <tr>
                        <td colspan="7"><strong>Total:</strong></td>
                        <td id="totalTrafficSum">0 GB</td>
                        <td id="balanceSum">0 GB</td>
                    </tr>
                </tfoot>
            </table>
        </div>

        <div class="pagination" id="pagination"></div>
    </div>

    <p class="version">Version 1.2.0</p>
</body>
</html>
